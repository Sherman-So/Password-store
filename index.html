<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>密碼與個人資料管家</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- CryptoJS for AES Encryption -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-size: 16px; /* 基礎字體加大 */
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea, select {
      font-size: 16px !important; /* 防止 iOS 自動放大且維持大字體 */
      user-select: text;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Lock Screen Overlay -->
  <div id="lockScreen" class="fixed inset-0 bg-slate-900 bg-opacity-95 z-50 flex flex-col items-center justify-center p-6 text-white">
    <div class="w-full max-w-sm text-center">
      <div class="inline-flex p-4 bg-blue-600 rounded-full mb-4 shadow-lg shadow-blue-500/30">
        <i data-lucide="shield-lock" class="w-10 h-10 text-white"></i>
      </div>
      <h1 class="text-2xl font-bold mb-2" id="lockTitle">密碼管家</h1>
      <p class="text-sm text-slate-300 mb-6" id="lockDesc">請輸入主密碼解鎖資料庫</p>
      
      <form id="masterPasswordForm" onsubmit="handleMasterPassword(event)">
        <div class="relative mb-4">
          <input type="password" id="masterPasswordInput" placeholder="輸入主密碼..." required
            class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-center text-white text-lg focus:outline-none focus:border-blue-500 transition">
        </div>
        <button type="submit" 
          class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-xl text-lg shadow-lg shadow-blue-600/30 transition">
          解鎖 App
        </button>
      </form>
      <p id="lockError" class="text-red-400 text-sm mt-3 hidden"></p>
    </div>
  </div>

  <!-- Main App Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="goHome()">
        <i data-lucide="key-round" class="w-6 h-6 text-blue-400"></i>
        <span class="font-bold text-lg tracking-wide">密碼管家</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="exportData()" class="p-2 hover:bg-slate-800 rounded-lg text-slate-300" title="匯出備份">
          <i data-lucide="download" class="w-5 h-5"></i>
        </button>
        <label class="p-2 hover:bg-slate-800 rounded-lg text-slate-300 cursor-pointer" title="匯入備份">
          <i data-lucide="upload" class="w-5 h-5"></i>
          <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
        </label>
        <button onclick="lockApp()" class="p-2 hover:bg-slate-800 rounded-lg text-slate-300" title="鎖定">
          <i data-lucide="lock" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
    <!-- Search Bar -->
    <div class="max-w-md mx-auto px-4 pb-3">
      <div class="relative">
        <i data-lucide="search" class="w-5 h-5 absolute left-3 top-2.5 text-slate-400"></i>
        <input type="text" id="globalSearch" placeholder="搜尋項目或名稱..." oninput="handleSearch()"
          class="w-full pl-10 pr-4 py-2 bg-slate-800 text-slate-100 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-slate-500">
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="max-w-md mx-auto w-full flex-1 p-4 pb-20">
    <!-- Category View -->
    <div id="homeCategoryView" class="grid grid-cols-2 gap-3">
      <!-- Generated by JS -->
    </div>

    <!-- Items List View -->
    <div id="itemsListView" class="hidden">
      <div class="flex items-center justify-between mb-4">
        <button onclick="goHome()" class="flex items-center gap-1 text-blue-600 font-medium py-1 px-2 -ml-2 rounded hover:bg-blue-50">
          <i data-lucide="chevron-left" class="w-5 h-5"></i> 主頁
        </button>
        <h2 id="currentCategoryTitle" class="text-lg font-bold text-slate-800">小分類列表</h2>
        <button onclick="openAddModal()" class="flex items-center gap-1 bg-blue-600 text-white text-sm px-3 py-1.5 rounded-lg font-medium shadow hover:bg-blue-700">
          <i data-lucide="plus" class="w-4 h-4"></i> 新增
        </button>
      </div>
      <div id="itemsContainer" class="space-y-3">
        <!-- Item Cards generated by JS -->
      </div>
    </div>
  </main>

  <!-- Add/Edit Modal -->
  <div id="itemModal" class="fixed inset-0 bg-slate-900 bg-opacity-60 z-40 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-xl">
      <div class="px-5 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
        <h3 id="modalTitle" class="font-bold text-lg text-slate-800">新增資料</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>
      <form id="itemForm" onsubmit="saveItem(event)" class="p-5 overflow-y-auto space-y-4 flex-1">
        <input type="hidden" id="editItemId">
        <input type="hidden" id="editCategoryId">
        
        <div id="dynamicFields" class="space-y-4">
          <!-- Form fields injected by JS -->
        </div>

        <div class="pt-4 flex gap-3">
          <button type="button" onclick="closeModal()" class="flex-1 py-3 border border-slate-300 rounded-xl font-medium text-slate-600 hover:bg-slate-50">取消</button>
          <button type="submit" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700 shadow">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white text-sm px-4 py-2.5 rounded-full shadow-lg z-50 opacity-0 pointer-events-none transition-opacity duration-300">
    已複製到剪貼簿
  </div>

  <script>
    // Category Schema Definition
    const CATEGORIES = [
      { id: '1', name: '個人銀行戶口', icon: 'landmark', fields: [
        { key: 'bankName', label: '銀行名稱', type: 'text', req: true },
        { key: 'accName', label: '戶口名稱', type: 'text', req: true },
        { key: 'accNo', label: '戶口號碼', type: 'text', req: true },
        { key: 'password', label: '網銀密碼/PIN', type: 'password', req: true },
        { key: 'updatedAt', label: '更新日期', type: 'date', req: true },
        { key: 'notes', label: '備註', type: 'text' }
      ]},
      { id: '2', name: '公司銀行戶口', icon: 'building-2', fields: [
        { key: 'bankName', label: '銀行名稱', type: 'text', req: true },
        { key: 'companyName', label: '公司名稱', type: 'text' },
        { key: 'accName', label: '戶口名稱', type: 'text', req: true },
        { key: 'accNo', label: '戶口號碼', type: 'text', req: true },
        { key: 'password', label: '登入密碼', type: 'password', req: true },
        { key: 'signer', label: '授權簽署人', type: 'text' },
        { key: 'updatedAt', label: '更新日期', type: 'date', req: true }
      ]},
      { id: '3', name: '郵箱', icon: 'mail', fields: [
        { key: 'emailName', label: '郵箱名稱/地址', type: 'text', req: true },
        { key: 'password', label: '密碼', type: 'password', req: true },
        { key: 'backupEmail', label: '救援郵箱', type: 'text' },
        { key: 'updatedAt', label: '更新日期', type: 'date', req: true }
      ]},
      { id: '4', name: 'Wifi', icon: 'wifi', fields: [
        { key: 'wifiName', label: 'Wifi 名稱 (SSID)', type: 'text', req: true },
        { key: 'password', label: '密碼', type: 'password', req: true },
        { key: 'routerIp', label: '路由器 IP', type: 'text' },
        { key: 'updatedAt', label: '更新日期', type: 'date', req: true }
      ]},
      { id: '5', name: '付費網站', icon: 'credit-card', fields: [
        { key: 'siteName', label: '網站名稱', type: 'text', req: true },
        { key: 'loginName', label: '登入名稱', type: 'text', req: true },
        { key: 'password', label: '密碼', type: 'password', req: true },
        { key: 'cost', label: '費用 (HKD/USD)', type: 'text' },
        { key: 'expiryDate', label: '到期日', type: 'date' },
        { key: 'payMethod', label: '付款方式', type: 'text' },
        { key: 'autoRenew', label: '自動續費', type: 'text' },
        { key: 'updatedAt', label: '更新日期', type: 'date', req: true }
      ]},
      { id: '6', name: 'AI 網站', icon: 'bot', fields: [
        { key: 'siteName', label: '網站名稱', type: 'text', req: true },
        { key: 'loginName', label: '登入名稱', type: 'text', req: true },
        { key: 'password', label: '密碼', type: 'password', req: true },
        { key: 'plan', label: '訂閱方案 (Free/Pro)', type: 'text' },
        { key: 'apiKey', label: 'API Key (如有)', type: 'text' },
        { key: 'updatedAt', label: '更新日期', type: 'date', req: true }
      ]},
      { id: '7', name: '一般網站', icon: 'globe', fields: [
        { key: 'siteName', label: '網站名稱', type: 'text', req: true },
        { key: 'url', label: '網站 URL', type: 'text' },
        { key: 'loginName', label: '登入名稱', type: 'text', req: true },
        { key: 'password', label: '密碼', type: 'password', req: true },
        { key: 'updatedAt', label: '更新日期', type: 'date', req: true }
      ]},
      { id: '8', name: '生日日期', icon: 'cake', fields: [
        { key: 'personName', label: '姓名', type: 'text', req: true },
        { key: 'birthDate', label: '出生日期', type: 'date', req: true },
        { key: 'calendarType', label: '國曆 / 農曆', type: 'text' },
        { key: 'relation', label: '關係', type: 'text' }
      ]}
    ];

    // State Variables
    let masterPassword = '';
    let dbData = [];
    let currentCatId = null;

    // Local Storage Keys
    const DB_KEY = 'vault_encrypted_data';

    // Init App
    window.onload = () => {
      lucide.createIcons();
      checkVaultStatus();
    };

    function checkVaultStatus() {
      const stored = localStorage.getItem(DB_KEY);
      if (!stored) {
        document.getElementById('lockTitle').innerText = '設定主密碼';
        document.getElementById('lockDesc').innerText = '請設定你的專屬主密碼以加密資料';
      } else {
        document.getElementById('lockTitle').innerText = '解鎖密碼管家';
        document.getElementById('lockDesc').innerText = '請輸入主密碼存取資料';
      }
    }

    function handleMasterPassword(e) {
      e.preventDefault();
      const inputPass = document.getElementById('masterPasswordInput').value;
      const stored = localStorage.getItem(DB_KEY);

      if (!stored) {
        masterPassword = inputPass;
        dbData = [];
        saveVault();
        unlockSuccess();
      } else {
        try {
          const decryptedBytes = CryptoJS.AES.decrypt(stored, inputPass);
          const decryptedStr = decryptedBytes.toString(CryptoJS.enc.Utf8);
          if (!decryptedStr) throw new Error();
          dbData = JSON.parse(decryptedStr);
          masterPassword = inputPass;
          unlockSuccess();
        } catch (err) {
          showLockError('主密碼錯誤，請重試！');
        }
      }
    }

    function unlockSuccess() {
      document.getElementById('lockScreen').classList.add('hidden');
      document.getElementById('masterPasswordInput').value = '';
      renderCategories();
      lucide.createIcons();
    }

    function lockApp() {
      masterPassword = '';
      dbData = [];
      document.getElementById('lockScreen').classList.remove('hidden');
      document.getElementById('lockError').classList.add('hidden');
      checkVaultStatus();
    }

    function saveVault() {
      const encrypted = CryptoJS.AES.encrypt(JSON.stringify(dbData), masterPassword).toString();
      localStorage.setItem(DB_KEY, encrypted);
    }

    function showLockError(msg) {
      const errEl = document.getElementById('lockError');
      errEl.innerText = msg;
      errEl.classList.remove('hidden');
    }

    // Navigation Render
    function renderCategories() {
      document.getElementById('homeCategoryView').classList.remove('hidden');
      document.getElementById('itemsListView').classList.add('hidden');
      
      const grid = document.getElementById('homeCategoryView');
      grid.innerHTML = CATEGORIES.map(cat => {
        const count = dbData.filter(i => i.catId === cat.id).length;
        return `
          <div onclick="openCategory('${cat.id}')" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200/80 hover:shadow-md transition flex flex-col justify-between cursor-pointer">
            <div class="flex items-center justify-between mb-2">
              <div class="p-2.5 bg-blue-50 text-blue-600 rounded-lg">
                <i data-lucide="${cat.icon}" class="w-6 h-6"></i>
              </div>
              <span class="text-xs font-semibold px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full">${count}</span>
            </div>
            <h3 class="font-bold text-slate-800 text-base">${cat.name}</h3>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function openCategory(catId) {
      currentCatId = catId;
      const cat = CATEGORIES.find(c => c.id === catId);
      document.getElementById('currentCategoryTitle').innerText = cat.name;
      document.getElementById('homeCategoryView').classList.add('hidden');
      document.getElementById('itemsListView').classList.remove('hidden');
      renderItems();
    }

    function goHome() {
      currentCatId = null;
      document.getElementById('globalSearch').value = '';
      renderCategories();
    }

    // Items Render
    function renderItems(itemsToDisplay = null) {
      const items = itemsToDisplay || dbData.filter(i => i.catId === currentCatId);
      const cat = CATEGORIES.find(c => c.id === currentCatId);
      const container = document.getElementById('itemsContainer');

      if (items.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400">尚無相關記錄</div>`;
        return;
      }

      container.innerHTML = items.map(item => {
        const itemCat = CATEGORIES.find(c => c.id === item.catId);
        let fieldsHtml = itemCat.fields.map(f => {
          const val = item.data[f.key] || '-';
          if (f.type === 'password') {
            return `
              <div class="flex items-center justify-between text-base py-1">
                <span class="text-slate-500">${f.label}:</span>
                <div class="flex items-center gap-2">
                  <span id="pass-${item.id}" class="font-mono text-slate-800">••••••••</span>
                  <button onclick="togglePassword('${item.id}', '${val}')" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="eye" class="w-4 h-4"></i>
                  </button>
                  <button onclick="copyText('${val}')" class="text-blue-600 hover:text-blue-800">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            `;
          }
          return `
            <div class="flex items-center justify-between text-base py-1">
              <span class="text-slate-500">${f.label}:</span>
              <div class="flex items-center gap-2">
                <span class="font-medium text-slate-800">${val}</span>
                ${f.req ? `<button onclick="copyText('${val}')" class="text-blue-600 hover:text-blue-800"><i data-lucide="copy" class="w-4 h-4"></i></button>` : ''}
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-start mb-2 pb-2 border-b border-slate-100">
              <span class="font-bold text-slate-900 text-lg">${item.title}</span>
              <div class="flex items-center gap-2">
                <button onclick="editItem('${item.id}')" class="text-slate-400 hover:text-blue-600"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                <button onclick="deleteItem('${item.id}')" class="text-slate-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>
            </div>
            <div class="space-y-1">${fieldsHtml}</div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function togglePassword(itemId, actualPass) {
      const el = document.getElementById(`pass-${itemId}`);
      if (el.innerText === '••••••••') {
        el.innerText = actualPass;
      } else {
        el.innerText = '••••••••';
      }
    }

    // Add / Edit Modal
    function openAddModal() {
      const cat = CATEGORIES.find(c => c.id === currentCatId);
      document.getElementById('modalTitle').innerText = `新增 ${cat.name}`;
      document.getElementById('editItemId').value = '';
      document.getElementById('editCategoryId').value = currentCatId;
      
      const fieldsContainer = document.getElementById('dynamicFields');
      const today = new Date().toISOString().split('T')[0];

      fieldsContainer.innerHTML = cat.fields.map(f => {
        const defaultVal = f.key === 'updatedAt' ? today : '';
        return `
          <div>
            <label class="block text-base font-semibold text-slate-700 mb-1">${f.label} ${f.req ? '<span class="text-red-500">*</span>' : ''}</label>
            <input type="${f.type}" name="${f.key}" value="${defaultVal}" ${f.req ? 'required' : ''}
              class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        `;
      }).join('');

      document.getElementById('itemModal').classList.remove('hidden');
    }

    function editItem(id) {
      const item = dbData.find(i => i.id === id);
      const cat = CATEGORIES.find(c => c.id === item.catId);
      currentCatId = item.catId;

      document.getElementById('modalTitle').innerText = `修改 ${cat.name}`;
      document.getElementById('editItemId').value = item.id;
      document.getElementById('editCategoryId').value = item.catId;

      const fieldsContainer = document.getElementById('dynamicFields');
      fieldsContainer.innerHTML = cat.fields.map(f => {
        const val = item.data[f.key] || '';
        return `
          <div>
            <label class="block text-base font-semibold text-slate-700 mb-1">${f.label} ${f.req ? '<span class="text-red-500">*</span>' : ''}</label>
            <input type="${f.type}" name="${f.key}" value="${val}" ${f.req ? 'required' : ''}
              class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        `;
      }).join('');

      document.getElementById('itemModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('itemModal').classList.add('hidden');
    }

    function saveItem(e) {
      e.preventDefault();
      const itemId = document.getElementById('editItemId').value;
      const catId = document.getElementById('editCategoryId').value;
      const cat = CATEGORIES.find(c => c.id === catId);

      const formData = new FormData(e.target);
      const dataObj = {};
      cat.fields.forEach(f => {
        dataObj[f.key] = formData.get(f.key);
      });

      // Item Title logic
      let title = dataObj.bankName || dataObj.emailName || dataObj.wifiName || dataObj.siteName || dataObj.personName || '未命名項目';

      if (itemId) {
        // Edit
        const idx = dbData.findIndex(i => i.id === itemId);
        if (idx !== -1) {
          dbData[idx] = { id: itemId, catId, title, data: dataObj };
        }
      } else {
        // New
        dbData.push({
          id: Date.now().toString(),
          catId,
          title,
          data: dataObj
        });
      }

      saveVault();
      closeModal();
      renderItems();
    }

    function deleteItem(id) {
      if (confirm('確定要刪除這筆記錄嗎？此操作無法恢復。')) {
        dbData = dbData.filter(i => i.id !== id);
        saveVault();
        renderItems();
      }
    }

    // Search
    function handleSearch() {
      const q = document.getElementById('globalSearch').value.trim().toLowerCase();
      if (!q) {
        if (currentCatId) openCategory(currentCatId);
        else renderCategories();
        return;
      }

      document.getElementById('homeCategoryView').classList.add('hidden');
      document.getElementById('itemsListView').classList.remove('hidden');
      document.getElementById('currentCategoryTitle').innerText = '搜尋結果';

      const matched = dbData.filter(item => {
        const titleMatch = item.title.toLowerCase().includes(q);
        const dataMatch = Object.values(item.data).some(v => String(v).toLowerCase().includes(q));
        return titleMatch || dataMatch;
      });

      renderItems(matched);
    }

    // Export / Import
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dbData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `password_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('備份 JSON 檔已匯出');
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (Array.isArray(imported)) {
            dbData = imported;
            saveVault();
            if (currentCatId) renderItems();
            else renderCategories();
            showToast('資料匯入成功！');
          } else {
            alert('無效的備份檔案格式');
          }
        } catch (err) {
          alert('解析檔案失敗，請確定檔案為正確的 JSON 格式');
        }
      };
      reader.readAsText(file);
    }

    // Helper
    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('已複製到剪貼簿');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }
  </script>
