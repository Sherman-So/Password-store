    /**
     * App State & Local Storage Keys
     */
    const STORAGE_SALT_KEY = 'vault_master_salt';
    const STORAGE_VERIFY_KEY = 'vault_master_verify';
    const STORAGE_DATA_KEY = 'vault_encrypted_data';

    let masterKey = null; // Session key derived from master password
    let currentVault = []; // Decrypted vault items array
    let activeCategory = null;
    let pwdTargetInputId = null;

    // DOM Elements
    const mainContent = document.getElementById('main-content');
    const headerActions = document.getElementById('header-actions');
    const lockBtn = document.getElementById('lock-btn');
    const settingsBtn = document.getElementById('settings-btn');
    const pwdGenModal = document.getElementById('pwd-gen-modal');

    /**
     * Initialize Application
     */
    window.addEventListener('DOMContentLoaded', () => {
      initApp();
      setupPasswordGenEvents();

      lockBtn.addEventListener('click', lockVault);
      settingsBtn.addEventListener('click', renderSettingsView);
    });

    function initApp() {
      masterKey = null;
      currentVault = [];
      headerActions.classList.add('hidden');

      const salt = localStorage.getItem(STORAGE_SALT_KEY);
      if (!salt) {
        renderSetupMasterView();
      } else {
        renderUnlockView();
      }
    }

    /**
     * Encryption Helpers (AES-256 via CryptoJS)
     */
    function deriveKey(password, saltHex) {
      return CryptoJS.PBKDF2(password, CryptoJS.enc.Hex.parse(saltHex), {
        keySize: 256 / 32,
        iterations: 10000
      }).toString();
    }

    function saveVaultToStorage() {
      if (!masterKey) return;
      const jsonString = JSON.stringify(currentVault);
      const encrypted = CryptoJS.AES.encrypt(jsonString, masterKey).toString();
      localStorage.setItem(STORAGE_DATA_KEY, encrypted);
    }

    function loadVaultFromStorage() {
      const encrypted = localStorage.getItem(STORAGE_DATA_KEY);
      if (!encrypted) {
        currentVault = [];
        return true;
      }
      try {
        const decryptedBytes = CryptoJS.AES.decrypt(encrypted, masterKey);
        const jsonString = decryptedBytes.toString(CryptoJS.enc.Utf8);
        if (!jsonString) return false;
        currentVault = JSON.parse(jsonString);
        return true;
      } catch (e) {
        return false;
      }
    }

    /**
     * Toast System
     */
    function showToast(msg, icon = 'fa-check-circle') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.innerText = msg;
      toastIcon.className = `fa-solid ${icon}`;

      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
      }, 2200);
    }

    /**
     * Clipboard Copy Tool
     */
    function copyToClipboard(text, label = '資料') {
      if (!text) return;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => showToast(`已複製${label}`));
      } else {
        const input = document.createElement('textarea');
        input.value = text;
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.focus();
        input.select();
        try {
          document.execCommand('copy');
          showToast(`已複製${label}`);
        } catch (err) {
          showToast('複製失敗', 'fa-triangle-exclamation');
        }
        document.body.removeChild(input);
      }
    }

    /**

     */

      mainContent.innerHTML = `

            <p class="text-xs text-slate-400 max-w-xs">請設定解鎖主密碼。所有敏感資料將使用 AES-256 在本地進行加密。</p>
          </div>

          <form id="setup-form" class="w-full space-y-4 max-w-xs">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">主密碼 (Master Password)</label>
              <input type="password" id="setup-pwd" required minlength="6" placeholder="至少 6 位密碼" class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-cyan-500 text-slate-100">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">確認主密碼</label>
              <input type="password" id="setup-pwd-confirm" required placeholder="再次輸入主密碼" class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-cyan-500 text-slate-100">
            </div>
            <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-semibold rounded-xl text-sm shadow-lg hover:brightness-110 active:scale-95 transition">
              建立安全寶盒
            </button>
          </form>
        </div>
      `;

      document.getElementById('setup-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const p1 = document.getElementById('setup-pwd').value;
        const p2 = document.getElementById('setup-pwd-confirm').value;

        if (p1 !== p2) {
          showToast('兩次密碼輸入不一致', 'fa-triangle-exclamation');
          return;
        }

        // Generate salt & store verification token
        const salt = CryptoJS.lib.WordArray.random(128 / 8).toString();
        const derivedKey = deriveKey(p1, salt);
        const verifyHash = CryptoJS.SHA256(derivedKey + salt).toString();

        localStorage.setItem(STORAGE_SALT_KEY, salt);
        localStorage.setItem(STORAGE_VERIFY_KEY, verifyHash);

        masterKey = derivedKey;
        saveVaultToStorage();

        showToast('寶盒已成功建立');
        renderHomeView();
      });
    }

    /**
     * VIEW 2: Unlock Vault View
     */
    function renderUnlockView() {
      mainContent.innerHTML = `
        <div class="flex-1 flex flex-col justify-center items-center py-6 space-y-6">
          <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-slate-800 border border-slate-700 rounded-2xl mx-auto flex items-center justify-center text-cyan-400 shadow-xl">

            </div>
            <h2 class="text-xl font-bold text-slate-100 pt-2">請解鎖寶盒</h2>
            <p class="text-xs text-slate-400">輸入主密碼以解密您的資料</p>
          </div>

          <form id="unlock-form" class="w-full space-y-4 max-w-xs">
            <div>
              <input type="password" id="unlock-pwd" required placeholder="請輸入主密碼" class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-center focus:outline-none focus:border-cyan-500 text-slate-100">
            </div>
            <button type="submit" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold rounded-xl text-sm shadow-lg active:scale-95 transition">
              解鎖 (Unlock)
            </button>
          </form>
        </div>
      `;

      document.getElementById('unlock-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const pwd = document.getElementById('unlock-pwd').value;
        const salt = localStorage.getItem(STORAGE_SALT_KEY);
        const storedVerify = localStorage.getItem(STORAGE_VERIFY_KEY);

        const derivedKey = deriveKey(pwd, salt);
        const verifyHash = CryptoJS.SHA256(derivedKey + salt).toString();

        if (verifyHash === storedVerify) {
          masterKey = derivedKey;
          if (loadVaultFromStorage()) {
            showToast('解鎖成功');
            renderHomeView();
          } else {
            showToast('資料解密失敗', 'fa-triangle-exclamation');
          }
        } else {
          showToast('主密碼錯誤', 'fa-triangle-exclamation');
        }
      });
    }

    function lockVault() {
      masterKey = null;
      currentVault = [];
      showToast('寶盒已鎖定', 'fa-lock');
      renderUnlockView();
      headerActions.classList.add('hidden');
    }

    /**
     * VIEW 3: Home View (Category Selection + Universal Search)
     */
    function renderHomeView() {
      headerActions.classList.remove('hidden');

      mainContent.innerHTML = `
        <div class="space-y-4">
          <!-- Universal Search Bar -->
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-sm"></i>
            <input type="text" id="global-search" placeholder="搜尋全庫 (例如: HSBC, Gmail, WiFi)..." class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500">
          </div>

          <!-- Dynamic Search Results or Categories -->
          <div id="search-results-container" class="hidden space-y-2">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">搜尋結果</h3>

            <div class="grid grid-cols-2 gap-3">

                const count = currentVault.filter(i => i.catId === cat.id).length;

                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;

      // Universal Search Handler
      const searchInput = document.getElementById('global-search');
      const searchContainer = document.getElementById('search-results-container');
      const searchList = document.getElementById('search-results-list');
      const gridContainer = document.getElementById('categories-grid-container');

      searchInput.addEventListener('input', (e) => {

        searchContainer.classList.remove('hidden');
        gridContainer.classList.add('hidden');

        const results = currentVault.filter(item => {
          return Object.values(item.data).some(val => String(val).toLowerCase().includes(q));
        });

        if (results.length === 0) {
          searchList.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">沒有找到相關資料</div>`;
          return;
        }

        searchList.innerHTML = results.map(item => renderItemCardHTML(item)).join('');
      });
    }

    /**
     * VIEW 4: Category Items List View
     */
    function renderCategoryView(catId) {
      activeCategory = CATEGORIES.find(c => c.id === catId);

    /**
     * HTML Card Component for Items
     */
    function renderItemCardHTML(item) {
      const cat = CATEGORIES.find(c => c.id === item.catId);
      const titleKey = cat.fields[0].id;
      const titleVal = item.data[titleKey] || '未命名項';

          <div class="flex justify-between items-start">

                <i class="fa-solid fa-pen-to-square text-xs"></i>
              </button>
              <button onclick="deleteItem('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-slate-700/50 transition">
                <i class="fa-solid fa-trash text-xs"></i>
              </button>
            </div>
          </div>

          <!-- Fields Details Grid -->
          <div class="grid grid-cols-1 gap-1.5 pt-1 border-t border-slate-800/80">
            ${cat.fields.map(f => {
              const val = item.data[f.id];
              if (!val) return '';
              const isPassword = f.type === 'password';
              return `
                <div class="flex justify-between items-center text-[11px]">
                  <span class="text-slate-400">${f.label}:</span>

    /**
     * VIEW 5: Add / Edit Item Form Generator
     */
    function renderFormView(catId, itemId = null) {
      const cat = CATEGORIES.find(c => c.id === catId);
      const isEdit = !!itemId;
      const existingItem = isEdit ? currentVault.find(i => i.id === itemId) : null;
      const formData = existingItem ? existingItem.data : {};

      const todayStr = new Date().toISOString().split('T')[0];

      mainContent.innerHTML = `
        <div class="space-y-4">
          <!-- Top Header -->
          <div class="flex items-center justify-between">
            <button onclick="renderCategoryView('${catId}')" class="flex items-center space-x-1 text-xs text-slate-400 hover:text-white py-1">
              <i class="fa-solid fa-chevron-left"></i>
              <span>取消</span>
            </button>
            <span class="text-xs font-semibold text-slate-300">
              ${isEdit ? '修改資料' : '新增資料'} (${cat.name})
            </span>
          </div>

          <!-- Dynamic Form -->
          <form id="item-form" class="space-y-3">
            ${cat.fields.map(f => {
              let value = formData[f.id] !== undefined ? formData[f.id] : '';
              if (!isEdit && f.defaultToday && !value) value = todayStr;

              if (f.type === 'select') {
                return `
                  <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">${f.label} ${f.req ? '*' : ''}</label>
                    <select name="${f.id}" ${f.req ? 'required' : ''} class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                      ${f.options.map(opt => `<option value="${opt}" ${value === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                    </select>
                  </div>
                `;
              }

              if (f.type === 'textarea') {
                return `
                  <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">${f.label} ${f.req ? '*' : ''}</label>
                    <textarea name="${f.id}" rows="2" ${f.req ? 'required' : ''} placeholder="${f.placeholder || ''}" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-cyan-500">${escapeHtml(value)}</textarea>
                  </div>
                `;
              }

              if (f.type === 'password') {
                return `
                  <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">${f.label} ${f.req ? '*' : ''}</label>
                    <div class="relative flex items-center">
                      <input type="password" id="input-${f.id}" name="${f.id}" value="${escapeHtml(value)}" ${f.req ? 'required' : ''} class="w-full pl-3 pr-16 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200 font-mono focus:outline-none focus:border-cyan-500">
                      <div class="absolute right-2 flex items-center space-x-1">
                        <button type="button" onclick="toggleInputMask('input-${f.id}', this)" class="p-1 text-slate-400 hover:text-slate-200">
                          <i class="fa-regular fa-eye text-xs"></i>
                        </button>
                        <button type="button" onclick="openPasswordGenerator('input-${f.id}')" title="生成強密碼" class="p-1 text-cyan-400 hover:text-cyan-300">
                          <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
                        </button>
                      </div>
                    </div>
                  </div>
                `;
              }

              return `
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">${f.label} ${f.req ? '*' : ''}</label>
                  <input type="${f.type}" name="${f.id}" value="${escapeHtml(value)}" ${f.req ? 'required' : ''} placeholder="${f.placeholder || ''}" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                </div>
              `;
            }).join('')}

            <div class="pt-3">
              <button type="submit" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold rounded-xl shadow-lg active:scale-95 transition">
                ${isEdit ? '儲存變更' : '新增記錄'}
              </button>
            </div>
          </form>
        </div>
      `;

      document.getElementById('item-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const formEl = e.target;
        const newFormData = {};
        
        cat.fields.forEach(f => {
          const input = formEl.elements[f.id];
          if (input) newFormData[f.id] = input.value;
        });

        if (isEdit) {
          const idx = currentVault.findIndex(i => i.id === itemId);
          if (idx !== -1) {
            currentVault[idx].data = newFormData;
            currentVault[idx].updatedAt = new Date().toISOString();
          }
        } else {
          currentVault.push({
            id: 'item_' + Date.now(),
            catId: catId,
            data: newFormData,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          });
        }

        saveVaultToStorage();
        showToast(isEdit ? '變更已儲存' : '已新增記錄');
        renderCategoryView(catId);
      });
    }

    /**
     * Delete Item Logic
     */
    function deleteItem(itemId) {
      if (!confirm('確定要刪除這筆記錄嗎？')) return;
      const item = currentVault.find(i => i.id === itemId);
      const catId = item ? item.catId : null;

      currentVault = currentVault.filter(i => i.id !== itemId);
      saveVaultToStorage();
      showToast('記錄已刪除', 'fa-trash');

      if (catId && activeCategory && activeCategory.id === catId) {
        renderCategoryView(catId);
      } else {
        renderHomeView();
      }
    }

    /**
     * VIEW 6: Settings & Backup View
     */
    function renderSettingsView() {
      mainContent.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <button onclick="renderHomeView()" class="flex items-center space-x-1 text-xs text-slate-400 hover:text-white py-1">
              <i class="fa-solid fa-chevron-left"></i>
              <span>返回</span>
            </button>
            <span class="text-xs font-semibold text-slate-300">設定與資料管理</span>
          </div>

          <div class="bg-slate-800/60 border border-slate-800 rounded-2xl p-4 space-y-3">
            <h3 class="text-xs font-bold text-slate-200 border-b border-slate-800 pb-2">數據備份與匯入</h3>
            
            <p class="text-[11px] text-slate-400 leading-relaxed">
              您的資料經過加密存儲在瀏覽器本地。建議定期備份備份檔以防數據丟失。
            </p>

            <div class="space-y-2 pt-1">
              <button onclick="exportEncryptedBackup()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-xs font-semibold flex items-center justify-center space-x-2 transition">
                <i class="fa-solid fa-download text-cyan-400"></i>
                <span>匯出加密備份檔 (.json)</span>
              </button>

              <label class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-xs font-semibold flex items-center justify-center space-x-2 cursor-pointer transition">
                <i class="fa-solid fa-upload text-cyan-400"></i>
                <span>匯入備份檔 (.json)</span>
                <input type="file" id="import-file" accept=".json" onchange="importEncryptedBackup(event)" class="hidden">
              </label>
            </div>
          </div>

          <div class="bg-slate-800/60 border border-slate-800 rounded-2xl p-4 space-y-3">
            <h3 class="text-xs font-bold text-rose-400 border-b border-slate-800 pb-2">危險區域</h3>
            <button onclick="resetVault()" class="w-full py-2 bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/50 text-rose-300 rounded-xl text-xs font-semibold transition">
              清空寶盒並重設主密碼
            </button>
          </div>
        </div>
      `;
    }

    /**
     * Backup & Export Functionality
     */
    function exportEncryptedBackup() {
      const encryptedData = localStorage.getItem(STORAGE_DATA_KEY) || '';
      const salt = localStorage.getItem(STORAGE_SALT_KEY) || '';
      const verify = localStorage.getItem(STORAGE_VERIFY_KEY) || '';

      const backupObj = {
        version: '1.0',
        timestamp: new Date().toISOString(),
        salt: salt,
        verify: verify,
        vault: encryptedData
      };

      const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `password_vault_backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('已完成備份檔匯出');
    }

    function importEncryptedBackup(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const backupObj = JSON.parse(evt.target.result);
          if (!backupObj.salt || !backupObj.verify) {
            showToast('無效的備份檔案格式', 'fa-triangle-exclamation');
            return;
          }

          if (confirm('匯入備份將會覆蓋當前所有資料，是否繼續？')) {
            localStorage.setItem(STORAGE_SALT_KEY, backupObj.salt);
            localStorage.setItem(STORAGE_VERIFY_KEY, backupObj.verify);
            localStorage.setItem(STORAGE_DATA_KEY, backupObj.vault || '');
            showToast('備份檔案匯入成功');
            lockVault();
          }
        } catch (err) {
          showToast('無法讀取檔案', 'fa-triangle-exclamation');
        }
      };
      reader.readAsText(file);
    }

    function resetVault() {
      if (confirm('警告：此操作將會清除所有密碼資料，無法復原！是否確定？')) {
        localStorage.removeItem(STORAGE_SALT_KEY);
        localStorage.removeItem(STORAGE_VERIFY_KEY);
        localStorage.removeItem(STORAGE_DATA_KEY);
        showToast('寶盒已重設');
        initApp();
      }
    }

    /**
     * Password Generator Modal logic
     */
    function setupPasswordGenEvents() {
      const closeBtn = document.getElementById('close-pwd-gen');
      const regenBtn = document.getElementById('regen-pwd-btn');
      const applyBtn = document.getElementById('apply-pwd-btn');
      const copyGenBtn = document.getElementById('copy-gen-pwd');
      const lenInput = document.getElementById('pwd-length');
      const lenValDisplay = document.getElementById('pwd-len-val');

      lenInput.addEventListener('input', (e) => {
        lenValDisplay.innerText = e.target.value;
        generateModalPassword();
      });

      closeBtn.addEventListener('click', () => pwdGenModal.classList.add('hidden'));
      regenBtn.addEventListener('click', generateModalPassword);

      copyGenBtn.addEventListener('click', () => {
        const pwd = document.getElementById('gen-pwd-output').innerText;
        copyToClipboard(pwd, '生成的密碼');
      });

      applyBtn.addEventListener('click', () => {
        const pwd = document.getElementById('gen-pwd-output').innerText;
        if (pwdTargetInputId) {
          const inputEl = document.getElementById(pwdTargetInputId);
          if (inputEl) inputEl.value = pwd;
        }
        pwdGenModal.classList.add('hidden');
        showToast('密碼已自動套用');
      });
    }

    function openPasswordGenerator(inputId) {
      pwdTargetInputId = inputId;
      pwdGenModal.classList.remove('hidden');
      generateModalPassword();
    }

    function generateModalPassword() {
      const len = parseInt(document.getElementById('pwd-length').value, 10);
      const incNum = document.getElementById('pwd-inc-num').checked;
      const incSym = document.getElementById('pwd-inc-sym').checked;

      const alpha = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const nums = '0123456789';
      const syms = '!@#$%^&*()_+-=[]{}|;:,.<>?';

      let chars = alpha;
      if (incNum) chars += nums;
      if (incSym) chars += syms;

      let result = '';
      for (let i = 0; i < len; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }

      document.getElementById('gen-pwd-output').innerText = result;
    }

    /**
     * UI Helper Utilities
     */
    function togglePasswordVisibility(elementId, btn) {
      const el = document.getElementById(elementId);
      const icon = btn.querySelector('i');
      const rawText = el.getAttribute('data-raw');

      if (el.innerText === '••••••••') {
        el.innerText = rawText;
        icon.className = 'fa-regular fa-eye-slash text-[10px] text-cyan-400';
      } else {
        el.innerText = '••••••••';
        icon.className = 'fa-regular fa-eye text-[10px] text-slate-500';
      }
    }

    function toggleInputMask(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash text-xs text-cyan-400';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye text-xs text-slate-400';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '& mygt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeJsString(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
  </script>
</body>
</html>
